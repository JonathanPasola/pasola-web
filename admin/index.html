<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1A2C3D" />
<title>PASOLA · CRM</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon-admin.svg" />
<link rel="icon" type="image/png" href="/favicon-admin.png" />
<link rel="stylesheet" href="/assets/fonts/pasola-fonts.css" />
<style>
:root{
  --indigo:#1A2C3D; --indigo-deep:#12202E; --ivory:#FAF8F4; --ivory-warm:#F5F1EC;
  --card:#FFFFFF; --gold:#C7A574; --gold-soft:rgba(199,165,116,.16); --gold-ink:#8a6a3a;
  --dusk:#3D5675; --dusk-soft:rgba(61,86,117,.12); --terra:#8B4A2E; --terra-soft:rgba(139,74,46,.13);
  --green:#2D8B5E; --green-soft:rgba(45,139,94,.14);
  --ink:#1A2C3D; --muted:#7C8A99; --line:rgba(26,44,61,.10); --line-2:rgba(26,44,61,.06);
  --bg:var(--ivory);
  --f-display:'Cinzel',Georgia,'Times New Roman',serif;
  --f-edit:'Cormorant Garamond',Georgia,serif;
  --f-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(26,44,61,.05),0 8px 24px -18px rgba(26,44,61,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:14px}
.hidden{display:none !important}
button{font-family:inherit}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{max-width:380px;width:100%;background:var(--card);padding:44px 38px;border:.5px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.login svg{width:74px;height:40px;color:var(--indigo);display:block;margin:0 auto 22px}
.login h1{font-family:var(--f-display);font-size:16px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin-bottom:6px}
.login .sub{font-family:var(--f-edit);font-style:italic;font-size:14px;color:var(--dusk);text-align:center;margin-bottom:28px}
.fld{margin-bottom:16px}
.fld label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dusk);display:block;margin-bottom:7px}
.fld input,.fld select{width:100%;padding:11px 12px;font-family:var(--f-ui);font-size:15px;border:.5px solid var(--line);border-radius:4px;background:var(--ivory-warm);outline:none;color:var(--ink)}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.btn-primary{width:100%;padding:13px;background:var(--indigo);color:var(--ivory);border:0;border-radius:4px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;cursor:pointer}
.btn-primary:hover{background:var(--gold);color:var(--indigo)}
.err{font-family:var(--f-edit);font-style:italic;font-size:13px;color:var(--terra);text-align:center;margin-top:14px;min-height:18px}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:var(--indigo);color:var(--ivory);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:30px;height:17px;color:var(--gold)}
.brand-name{font-family:var(--f-display);font-size:14px;letter-spacing:.32em;padding-left:.32em;font-weight:500}
.brand-sub{font-family:var(--f-edit);font-style:italic;font-size:14px;color:rgba(250,248,244,.6)}
.topright{display:flex;align-items:center;gap:16px}
.topnav{display:flex;gap:2px;overflow-x:auto}
.topnav button{color:rgba(250,248,244,.62);background:transparent;border:0;text-decoration:none;font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:8px 13px;border-radius:3px;cursor:pointer;white-space:nowrap}
.topnav button.on{color:var(--indigo);background:var(--gold);font-weight:600}
.topnav button:not(.on):hover{color:var(--ivory);background:rgba(250,248,244,.08)}
.langsw{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.12em}
.langsw button{background:transparent;border:0;color:rgba(250,248,244,.55);cursor:pointer;font:inherit;padding:2px 3px}
.langsw button.on{color:var(--gold);font-weight:700}
.langsw span{color:rgba(250,248,244,.3)}
.usr{display:flex;align-items:center;gap:9px}
.usr .who{text-align:right;line-height:1.2}
.usr .who b{font-size:12px}
.usr .who small{font-size:10px;color:rgba(250,248,244,.55);text-transform:uppercase;letter-spacing:.1em}
.usr .out{background:transparent;border:.5px solid rgba(250,248,244,.25);color:var(--ivory);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:3px;cursor:pointer}
.usr .out:hover{border-color:rgba(250,248,244,.6)}

.wrap{max-width:1320px;margin:0 auto;padding:0 22px 60px}
.pagehead{padding:28px 0 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;font-weight:500;margin-top:7px}
.ey{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--dusk);font-weight:600}
.h-lead{font-family:var(--f-edit);font-style:italic;font-size:15px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:4px;padding:15px 17px;box-shadow:var(--shadow)}
.kpi .n{font-family:var(--f-display);font-size:29px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .n.g{color:var(--green)} .kpi .n.d{color:var(--dusk)} .kpi .n.t{color:var(--terra)}
.kpi .l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:9px}
.kpi .tr{font-size:11px;color:var(--muted);margin-top:5px}
.kpi .tr b{color:var(--green);font-weight:700}

/* PANEL */
.panel{background:var(--card);border:.5px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:.5px solid var(--line-2);gap:10px;flex-wrap:wrap}
.panel-h .t{font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.sub{font-size:11.5px;color:var(--muted)}

/* FUNNEL */
.funnel{display:flex;padding:18px;overflow-x:auto}
.stage{flex:1;min-width:118px;position:relative;padding:0 8px}
.stage:not(:last-child)::after{content:"›";position:absolute;right:-6px;top:14px;color:var(--muted);font-size:20px}
.stage .sv{font-family:var(--f-display);font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.stage .sl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stage .bar{height:4px;border-radius:2px;margin-top:9px;background:var(--dusk-soft)}
.stage .bar i{display:block;height:100%;border-radius:2px;background:var(--dusk)}
.stage.warm .sv{color:var(--terra)} .stage.warm .bar i{background:var(--terra)}
.stage.hot .sv{color:var(--green)} .stage.hot .bar i{background:var(--green)}

.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px;align-items:start}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;padding:11px 14px;flex-wrap:wrap;border-bottom:.5px solid var(--line-2)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--ivory-warm);border:.5px solid var(--line);border-radius:4px;padding:8px 11px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;color:var(--ink);font-size:13px;width:100%}
.segs{display:flex;gap:2px;background:var(--ivory-warm);border-radius:4px;padding:3px}
.seg{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-radius:3px;cursor:pointer;border:0;background:transparent}
.seg.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(26,44,61,.12);font-weight:600}
.chip-btn{font-size:11px;color:var(--dusk);border:.5px solid var(--line);background:transparent;border-radius:20px;padding:6px 12px;cursor:pointer}
.chip-btn.gold{border-color:var(--gold);color:var(--gold-ink);font-weight:600}

/* TABLE */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl thead th{text-align:left;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:.5px solid var(--line);white-space:nowrap}
.tbl tbody td{padding:12px 14px;border-bottom:.5px solid var(--line-2);vertical-align:middle}
.tbl tbody tr.clk{cursor:pointer}
.tbl tbody tr.clk:hover{background:var(--ivory-warm)}
.tbl .empty{text-align:center;padding:38px;color:var(--muted);font-style:italic}
.who2{display:flex;align-items:center;gap:11px}
.av{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;flex:none;background:var(--dusk-soft);color:var(--dusk)}
.av.k{background:var(--gold-soft);color:var(--gold-ink)}
.nm{font-weight:600;font-size:13.5px}
.small{font-size:11.5px;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.tbl a{color:var(--indigo);border-bottom:.5px solid var(--gold);text-decoration:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.heat-hot{background:var(--terra-soft);color:var(--terra)} .heat-hot .dot{background:var(--terra)}
.heat-warm{background:var(--gold-soft);color:var(--gold-ink)} .heat-warm .dot{background:var(--gold)}
.heat-cold{background:var(--dusk-soft);color:var(--dusk)} .heat-cold .dot{background:var(--dusk);opacity:.6}
.st-signed{background:var(--green-soft);color:var(--green)}
.st-wait{background:var(--terra-soft);color:var(--terra)}
.st-anon{background:transparent;color:var(--muted);border:.5px solid var(--line)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--dusk-soft);color:var(--dusk)}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.gold{background:var(--gold-soft);color:var(--gold-ink)}
.sig{display:inline-block;font-size:10.5px;color:var(--dusk);background:var(--dusk-soft);border-radius:3px;padding:2px 7px}
.sig.hot{color:var(--terra);background:var(--terra-soft)}
.tl{padding:6px 18px 16px 64px;background:var(--ivory-warm)}
.tl-item{position:relative;padding:0 0 12px 18px;border-left:1.5px solid var(--line)}
.tl-item:last-child{border-left-color:transparent}
.tl-item::before{content:"";position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--ivory-warm)}
.tl-item.g::before{background:var(--green)} .tl-item.d::before{background:var(--dusk)}
.tl-item .tt{font-size:13px;font-weight:600} .tl-item .td{font-size:11.5px;color:var(--muted)}

/* MINI (rail) */
.mini{padding:5px 0}
.mini-h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;padding:10px 18px 4px}
.mini-row{display:flex;align-items:center;gap:10px;padding:7px 18px}
.mini-row .ml{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .track{flex:1.1;height:5px;background:var(--dusk-soft);border-radius:3px;overflow:hidden}
.mini-row .track i{display:block;height:100%;background:var(--gold);border-radius:3px}
.mini-row .track i.d{background:var(--dusk)}
.mini-row .mv{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;min-width:26px;text-align:right}
.insight{margin:10px 18px 12px;padding:11px 13px;background:var(--dusk-soft);border-radius:4px;border-left:2.5px solid var(--dusk);font-size:12px;line-height:1.5}
.insight b{color:var(--dusk)}

/* EQUIPE */
.team-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px}
.team-form .fld{margin:0}
.team-form .full{grid-column:1 / -1}
.role-pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:12px;background:var(--dusk-soft);color:var(--dusk)}
.role-pill.owner{background:var(--gold-soft);color:var(--gold-ink)}
.mini-btn{font-size:11px;border:.5px solid var(--line);background:transparent;border-radius:4px;padding:5px 10px;cursor:pointer;color:var(--dusk)}
.mini-btn.on{background:var(--green-soft);color:var(--green);border-color:transparent}

.foot{margin-top:28px;padding-top:16px;border-top:.5px solid var(--line);font-size:11.5px;color:var(--muted)}
.feedback{font-size:12.5px;padding:9px 12px;border-radius:4px;margin:0 18px 12px}
.feedback.ok{background:var(--green-soft);color:var(--green)} .feedback.no{background:var(--terra-soft);color:var(--terra)}

@media(max-width:820px){
  .topbar{gap:12px}
  .topright{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:10px}
  .wrap{padding:0 14px 48px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .team-form{grid-template-columns:1fr}
  .pagehead h1{font-size:19px}
}
@media(max-width:440px){ .kpis{grid-template-columns:1fr 1fr} .brand-sub{display:none} .segs{flex:1 1 100%;justify-content:space-between} }
</style>
</head>

function t(k){return (I18N[LANG]&&I18N[LANG][k])||k;}

/* ---------- helpers ---------- */
function esc(v){return (v==null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function parseUTC(s){if(!s)return null;var iso=/Z|[+-]\d\d:?\d\d$/.test(s)?s:(String(s).replace(' ','T')+'Z');var d=new Date(iso);return isNaN(d.getTime())?null:d;}
function fmtDate(s){var d=parseUTC(s);if(!d)return s||'—';return d.toLocaleDateString(LANG=='en'?'en-GB':'fr-FR')+' '+d.toLocaleTimeString(LANG=='en'?'en-GB':'fr-FR',{hour:'2-digit',minute:'2-digit'});}
function fmtDay(s){var d=parseUTC(s);if(!d)return s||'—';return d.toLocaleDateString(LANG=='en'?'en-GB':'fr-FR');}
function projectOf(p){p=(p||'').toLowerCase();return p.indexOf('maison-cognac')>=0?'cognac':'sumba';}
function isCP(p){p=(p||'').toLowerCase();return p.indexOf('capital')>=0||p.indexOf('dossier')>=0||p.indexOf('access')>=0;}
var CC={US:{fr:'États-Unis',en:'United States'},FR:{fr:'France',en:'France'},IE:{fr:'Irlande',en:'Ireland'},DE:{fr:'Allemagne',en:'Germany'},SE:{fr:'Suède',en:'Sweden'},ID:{fr:'Indonésie',en:'Indonesia'},GB:{fr:'Royaume-Uni',en:'United Kingdom'},SG:{fr:'Singapour',en:'Singapore'},CH:{fr:'Suisse',en:'Switzerland'},BE:{fr:'Belgique',en:'Belgium'},NL:{fr:'Pays-Bas',en:'Netherlands'},ES:{fr:'Espagne',en:'Spain'},IT:{fr:'Italie',en:'Italy'},CA:{fr:'Canada',en:'Canada'},AU:{fr:'Australie',en:'Australia'},AE:{fr:'Émirats',en:'UAE'},TH:{fr:'Thaïlande',en:'Thailand'},HK:{fr:'Hong Kong',en:'Hong Kong'},JP:{fr:'Japon',en:'Japan'},PT:{fr:'Portugal',en:'Portugal'},IN:{fr:'Inde',en:'India'}};
function flag(cc){if(!cc||cc.length!==2)return'🏳️';try{return String.fromCodePoint.apply(null,[].map.call(cc.toUpperCase(),function(c){return 127397+c.charCodeAt(0);}));}catch(e){return'🏳️';}}
function cname(cc){if(!cc)return'—';var c=CC[cc.toUpperCase()];return c?(c[LANG]||c.fr):cc;}
function weekVisitors(){var wk=Date.now()-7*864e5;var s={};D.pv.forEach(function(p){var d=parseUTC(p.created_at);if(d&&d.getTime()>=wk&&p.visitor_id)s[p.visitor_id]=1;});return Object.keys(s).length;}
function sourceOf(pv){var m=(pv.url||'').match(/[?&]ref=([^&#]+)/i);if(m)return decodeURIComponent(m[1]);var r=(pv.referrer||'').trim();if(r){try{var h=new URL(r).hostname.replace(/^www\./,'');if(/instagram/.test(h))return'Instagram';if(/facebook|fb\./.test(h))return'Facebook';if(/linkedin|lnkd/.test(h))return'LinkedIn';if(/google|bing|duckduck/.test(h))return LANG=='en'?'Search':'Recherche';if(/pasola/.test(h))return LANG=='en'?'Internal':'Navigation interne';return h;}catch(e){}}var b=pv.browser||'';if(/Instagram/i.test(b))return'Instagram';if(/Facebook/i.test(b))return'Facebook';return LANG=='en'?'Direct':'Accès direct';}

/* ---------- auth ---------- */
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var email=document.getElementById('in-email').value.trim();
  var pass=document.getElementById('in-pass').value;
  var auth='Basic '+btoa(email+':'+pass);
  document.getElementById('loginErr').textContent='';
  document.getElementById('loginBtn').textContent='…';
  fetch(API+'/api/admin-me',{headers:{'Authorization':auth}}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(me){
    if(!me.ok)throw 0;
    AUTH=auth;ME=me;
    sessionStorage.setItem('pasola_crm_auth',AUTH);sessionStorage.setItem('pasola_crm_me',JSON.stringify(me));
    try{localStorage.setItem('pasola_is_owner','1');}catch(e){}
    boot();
  }).catch(function(){document.getElementById('loginErr').textContent=t('badcred');document.getElementById('loginBtn').textContent=t('signin');});
});
document.getElementById('logoutBtn').addEventListener('click',function(){
  sessionStorage.removeItem('pasola_crm_auth');sessionStorage.removeItem('pasola_crm_me');AUTH='';ME=null;
  document.getElementById('app').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');
});
document.querySelectorAll('.langsw button').forEach(function(b){b.addEventListener('click',function(){
  LANG=b.dataset.lang;localStorage.setItem('pasola_crm_lang',LANG);
  document.querySelectorAll('.langsw button').forEach(function(x){x.classList.toggle('on',x.dataset.lang===LANG);});

function boot(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('me-role').textContent=ME.role;

  document.querySelectorAll('.langsw button').forEach(function(x){x.classList.toggle('on',x.dataset.lang===LANG);});
  buildNav();loadAll();
}
function buildNav(){
  var items=[['contacts','contacts'],['overview','overview'],['dataroom','dataroom'],['affil','affil'],['sources','sources']];
  if(ME&&ME.role==='owner')items.push(['team','team']);
  var nav=document.getElementById('nav');nav.innerHTML='';
  items.forEach(function(it){var b=document.createElement('button');b.textContent=t(it[1]);b.className=(VIEW===it[0]?'on':'');b.onclick=function(){VIEW=it[0];openRow=null;buildNav();render();};nav.appendChild(b);});
}
function h(auth){return {'Authorization':AUTH};}
function loadAll(){
  var o={headers:h()};
  Promise.all([
    fetch(API+'/api/stats',o).then(function(r){return r.json();}).catch(function(){return{};}),
    fetch(API+'/api/pageviews-list',o).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(API+'/api/cp-requests-list',o).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(API+'/api/dossier-access-log',o).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(API+'/api/affiliate/list',o).then(function(r){return r.json();}).catch(function(){return{leads:[],by_ref:[]};}),
    (ME&&ME.role==='owner')?fetch(API+'/api/admin-users',o).then(function(r){return r.json();}).catch(function(){return[];}):Promise.resolve([])
  ]).then(function(res){
    D.stats=res[0]||{};D.pv=Array.isArray(res[1])?res[1]:[];D.cp=Array.isArray(res[2])?res[2]:[];
    D.act=Array.isArray(res[3])?res[3]:[];D.aff=(res[4]&&res[4].leads)?res[4]:{leads:[],by_ref:[]};
    D.team=Array.isArray(res[5])?res[5]:[];
    render();
  });
}

/* ---------- derive contacts / metrics ---------- */
function visitors(){
  var by={};
  D.pv.forEach(function(p){var v=p.visitor_id||'anon';if(!by[v])by[v]={id:v,hits:0,pages:[],cp:0,country:p.country,os:p.os,browser:p.browser,last:'',src:'',proj:{sumba:0,cognac:0}};
    var o=by[v];o.hits++;var pg=p.page||p.url||'';if(pg&&o.pages.indexOf(pg)<0)o.pages.push(pg);if(isCP(pg))o.cp++;o.proj[projectOf(pg)]++;
    if(!o.country&&p.country)o.country=p.country;if(!o.last||p.created_at>o.last){o.last=p.created_at;}if(!o.src||o.src==='Accès direct'||o.src==='Direct'){var s=sourceOf(p);o.src=s;}});
  return Object.keys(by).map(function(k){return by[k];});
}
function heat(v){if(v.cp>=2)return'hot';if(v.cp>=1)return'warm';return'cold';}
function metrics(){
  var vs=visitors();
  var uniq=vs.length;
  var eng=vs.filter(function(v){return v.cp>0;}).length;
  var bots=vs.filter(function(v){return v.hits<=1&&(v.country==='US');}).length;
  var signed=D.cp.filter(function(c){return c.status==='approved'&&c.email!=='jonathan.beraud@pasola.fr';}).length;
  var wait=D.cp.filter(function(c){return c.status==='pending';}).length;
  var pageNDA=vs.filter(function(v){return v.pages.some(function(p){return(p||'').toLowerCase().indexOf('access')>=0;});}).length;
  var active=(function(){var s={};D.act.forEach(function(a){if(a.email)s[a.email]=1;});return Object.keys(s).length;})();
  return {uniq:uniq,eng:eng,bots:bots,signed:signed,wait:wait,pageNDA:pageNDA,active:active,vs:vs};
}

function kcard(n,cls,l,tr){return '<div class="kpi"><div class="n '+cls+'">'+n+'</div><div class="l">'+l+'</div><div class="tr">'+tr+'</div></div>';}
function kpiRow(m){var wk=weekVisitors();var EN=LANG=='en';return '<div class="kpis">'+
  kcard(m.uniq,'',t('k_vis'),'30 j · <b>+'+wk+'</b> '+(EN?'this week':'cette semaine'))+
  kcard(m.eng,'d',t('k_eng'),EN?'opened the confidential zone':'a ouvert la zone confidentielle')+
  kcard(m.wait,'t',t('k_wait'),m.wait?(EN?'awaiting approval':'en attente d\'approbation'):(EN?'none pending':'aucune en attente'))+
  kcard(m.signed,'g',t('k_sign'),EN?'excl. owner':'hors owner')+
  kcard(m.bots,'',t('k_bots'),EN?'single-view US excluded':'US « une vue » exclus')+'</div>';}
function funnel(m){return '<div class="panel"><div class="panel-h"><span class="t">'+t('f_title')+'</span></div><div class="funnel">'+
  stage('',m.uniq,t('f_vis'),100)+stage('',m.eng,t('f_cp'),m.uniq?Math.max(6,m.eng/m.uniq*100):4)+
  stage('warm',m.pageNDA,t('f_nda'),m.uniq?Math.max(4,m.pageNDA/m.uniq*100):3)+
  stage('warm',m.signed,t('f_signed'),m.uniq?Math.max(2,m.signed/m.uniq*100):2)+
  stage('hot',m.active,t('f_active'),m.uniq?Math.max(2,m.active/m.uniq*100):2)+'</div></div>';}
function stage(c,v,l,w){return '<div class="stage '+c+'"><div class="sv tnum">'+v+'</div><div class="sl">'+l+'</div><div class="bar"><i style="width:'+w+'%"></i></div></div>';}

function viewOverview(){var m=metrics();return kpiRow(m)+'<div style="height:14px"></div>'+funnel(m);}

function contactRows(){
  var m=metrics();var rows=[];
  // identified (cp signers, non-owner)
  D.cp.filter(function(c){return c.email!=='jonathan.beraud@pasola.fr';}).forEach(function(c){
    var signed=c.status==='approved';
    rows.push({kind:'id',hot:signed?'hot':'warm',name:(c.first_name||'')+' '+(c.last_name||''),co:esc(c.entity||'—')+(c.capacity?'<br><span class="small">'+esc(c.capacity)+'</span>':''),
      src:(c.page_source||'').match(/ref:([^\s·]+)/i),srcRaw:c.page_source,country:c.country||'—',last:c.approved_at||c.signed_at,
      status:signed?'signed':'wait',cp:9,ip:c.signed_ip,email:c.email});
  });
  // engaged/anon visitors
  m.vs.filter(function(v){return v.hits>1||v.cp>0;}).forEach(function(v){
    rows.push({kind:'anon',hot:heat(v),name:t('anon'),co:'<span class="small">'+t('notid')+'</span>',srcRaw:v.src,country:v.country||'—',last:v.last,status:'anon',cp:v.cp,pages:v.pages,id:v.id});
  });
  var order={hot:0,warm:1,cold:2};
  rows.sort(function(a,b){if(order[a.hot]!==order[b.hot])return order[a.hot]-order[b.hot];return (b.last||'').localeCompare(a.last||'');});
  if(segment==='eng')rows=rows.filter(function(r){return r.cp>0;});
  if(segment==='id')rows=rows.filter(function(r){return r.kind==='id';});
  if(segment==='signed')rows=rows.filter(function(r){return r.status==='signed';});
  return rows;
}

    var heatpill='<span class="pill heat-'+r.hot+'"><span class="dot"></span>'+t(r.hot)+'</span>';
    var src=r.src?'<span class="sig hot">ref '+esc(r.src[1])+'</span>':'<span class="sig">'+esc(r.srcRaw||'—')+'</span>';
    var sig=r.cp>0?'<span class="sig hot">'+(LANG=='en'?'Capital Partners':'Zone Capital Partners')+'</span>':'<span class="small">'+((r.pages&&r.pages.length)||1)+' '+(LANG=='en'?'pages':'pages')+'</span>';

  }).join(''):'<tr><td colspan="8" class="empty">—</td></tr>';
  return kpiRow(m)+'<div style="height:14px"></div>'+funnel(m)+

   '<button class="chip-btn gold" id="expCsv">'+t('exportcsv')+'</button></div>'+
   '<div class="tw"><table class="tbl"><thead><tr><th>'+t('c_contact')+'</th><th>'+t('c_co')+'</th><th>'+t('c_src')+'</th><th>'+t('c_eng')+'</th><th>'+t('c_sig')+'</th><th>'+t('c_country')+'</th><th>'+t('c_last')+'</th><th>'+t('c_status')+'</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'+

function railSources(m){
  // pages by project
  function pagesByProj(proj){var by={};D.pv.forEach(function(p){var pg=p.page||p.url||'';if(projectOf(pg)!==proj)return;by[pg]=(by[pg]||0)+1;});var arr=Object.keys(by).map(function(k){return[k,by[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);var mx=arr.length?arr[0][1]:1;return arr;}
  function countriesByProj(proj){var by={};D.pv.forEach(function(p){var pg=p.page||p.url||'';if(projectOf(pg)!==proj)return;var c=p.country||'?';by[c]=(by[c]||0)+1;});return Object.keys(by).map(function(k){return[k,by[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);}
  // barre du haut (max) en INDIGO = highlight ; le reste en OR (comme l'artifact)
  function block(title,rows,ctry){var mx=rows.length?rows[0][1]:1;return '<div class="mini-h">'+title+'</div>'+(rows.length?rows.map(function(r,idx){var lab=ctry?(flag(r[0])+'&nbsp; '+esc(cname(r[0]))):esc(r[0]);return '<div class="mini-row"><span class="ml">'+lab+'</span><span class="track"><i class="'+(idx===0?'d':'')+'" style="width:'+Math.round(r[1]/mx*100)+'%"></i></span><span class="mv tnum">'+r[1]+'</span></div>';}).join(''):'<div class="mini-row"><span class="small">—</span></div>');}
  var EN=LANG=='en',todo=[];
  D.cp.filter(function(c){return c.status==='pending';}).forEach(function(c){todo.push('<span class="badge gold" style="margin-right:6px">'+(EN?'Approve':'Approuver')+'</span>'+esc((c.first_name||'')+' '+(c.last_name||'')));});
  if(m.eng>0)todo.push('<span class="pill heat-warm" style="margin-right:6px"><span class="dot"></span></span>'+m.eng+' '+(EN?'visitor(s) saw the Capital Partners zone':'visiteur(s) ont vu la zone Capital Partners'));
  if(!todo.length)todo.push('<span class="small">'+(EN?'Nothing to action right now.':'Rien à traiter pour le moment.')+'</span>');
  // Data room mini
  var dr=D.act.length?D.act.slice(0,4).map(function(a){var n=((a.first_name||'')+' '+(a.last_name||'')).trim()||a.email;return '<div class="mini-row"><span class="ml">'+esc(n)+'</span><span class="small">'+esc(a.file_label||a.action||'')+'</span></div>';}).join(''):'<div class="mini-row"><span class="small">'+t('dr_none')+'</span></div>';
  // Affiliés mini
  var leads=D.aff.leads||[];var paid=leads.filter(function(l){return l.paid;}).length;var due=(leads.length-paid)*150;
  var af='<div class="mini-row"><span class="ml">'+t('af_leads')+'</span><span class="mv tnum">'+leads.length+'</span></div><div class="mini-row"><span class="ml">'+t('af_paid')+'</span><span class="mv tnum">'+paid+'</span></div><div class="mini-row"><span class="ml">'+t('af_due')+'</span><span class="mv tnum">'+due+' €</span></div>';
  // Équipe mini (owner only)
  var team='';
  if(ME&&ME.role==='owner'){var us=D.team||[];team='<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('team')+' &amp; '+(EN?'access':'accès')+'</span><span class="sub">'+us.length+'</span></div><div class="mini">'+us.slice(0,4).map(function(u){return '<div class="mini-row"><div class="av'+(u.role==='owner'?' k':'')+'" style="width:26px;height:26px;font-size:10px">'+esc((u.name||u.email||'?').slice(0,2).toUpperCase())+'</div><span class="ml">'+esc(u.name||u.email)+'</span><span class="role-pill'+(u.role==='owner'?' owner':'')+'">'+t('tm_'+u.role)+'</span></div>';}).join('')+'<div style="padding:9px 18px"><button class="chip-btn gold" data-goteam="1" style="width:100%">+ '+t('tm_new')+'</button></div></div></div>';}
  return '<div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('pages')+'</span></div><div class="mini">'+
     block('1 · '+t('sumba'),pagesByProj('sumba'),false)+block('2 · '+t('cognac'),pagesByProj('cognac'),false)+'</div></div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('countries')+'</span></div><div class="mini">'+
     block('1 · '+t('sumba'),countriesByProj('sumba'),true)+block('2 · '+t('cognac'),countriesByProj('cognac'),true)+
     '<div class="insight"><b>Insight :</b> '+m.bots+' '+t('bots_note')+'</div></div></div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+(EN?'To action':'À traiter')+'</span></div><div class="mini">'+
     todo.map(function(i){return '<div class="mini-row"><span class="ml">'+i+'</span></div>';}).join('')+'</div></div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('dr_title')+'</span><span class="sub">'+D.act.length+'</span></div><div class="mini">'+dr+'</div></div>'+
   '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('af_title')+'</span></div><div class="mini">'+af+'</div></div>'+

function viewAffil(){
  var leads=D.aff.leads||[];var paid=leads.filter(function(l){return l.paid;}).length;var due=(leads.length-paid)*150;
  var body=leads.length?leads.map(function(l){var name=((l.firstname||'')+' '+(l.lastname||'')).trim()||'—';
    var btn=l.paid?'<button class="mini-btn on" data-paid="'+l.id+'" data-to="0">'+t('af_ispaid')+'</button>':'<button class="mini-btn" data-paid="'+l.id+'" data-to="1">'+t('af_markpaid')+'</button>';
    return '<tr><td class="small">'+esc(fmtDay(l.created_at))+'</td><td>'+(l.ref?'<span class="badge gold">'+esc(l.ref)+'</span>':'<span class="small">—</span>')+'</td><td>'+esc(name)+'</td><td class="small">'+esc(l.email)+'</td><td class="small">'+esc(l.location||'')+'</td><td>'+btn+'</td></tr>';
  }).join(''):'<tr><td colspan="6" class="empty">'+t('af_none')+'</td></tr>';
  return '<div class="kpis"><div class="kpi"><div class="n">'+leads.length+'</div><div class="l">'+t('af_leads')+'</div></div><div class="kpi"><div class="n g">'+paid+'</div><div class="l">'+t('af_paid')+'</div></div><div class="kpi"><div class="n t">'+due+' €</div><div class="l">'+t('af_due')+'</div></div></div>'+
   '<div style="height:14px"></div><div class="panel"><div class="panel-h"><span class="t">'+t('af_title')+'</span></div><div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Ref</th><th>'+t('tm_name')+'</th><th>Email</th><th>'+t('c_country')+'</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

function viewTeam(){
  if(!ME||ME.role!=='owner')return '<div class="panel"><div class="empty" style="padding:40px">'+t('tm_onlyowner')+'</div></div>';
  var body=(D.team||[]).map(function(u){
    var you=(ME&&u.email===ME.email)?' <span class="small">('+t('tm_you')+')</span>':'';
    var roleP='<span class="role-pill'+(u.role==='owner'?' owner':'')+'">'+t('tm_'+u.role)+'</span>';
    var act=u.legacy?'<span class="small">—</span>':'<button class="mini-btn'+(u.active?' on':'')+'" data-uid="'+u.id+'" data-to="'+(u.active?0:1)+'">'+(u.active?t('tm_active'):t('tm_disabled'))+'</button>';
    return '<tr><td><div class="who2"><div class="av'+(u.role==='owner'?' k':'')+'">'+esc((u.name||u.email||'?').slice(0,2).toUpperCase())+'</div><div><div class="nm">'+esc(u.name||'—')+you+'</div><div class="small">'+esc(u.email)+'</div></div></div></td><td>'+roleP+'</td><td class="small">'+esc(fmtDay(u.created_at))+'</td><td class="small">'+esc(u.last_login?fmtDate(u.last_login):'—')+'</td><td>'+act+'</td></tr>';
  }).join('');
  return '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><span class="t">'+t('tm_new')+'</span></div>'+
    '<div class="feedback ok hidden" id="tmMsg"></div>'+
    '<div class="team-form">'+
     '<div class="fld"><label>'+t('tm_name')+'</label><input id="nu-name"/></div>'+
     '<div class="fld"><label>'+t('email')+'</label><input id="nu-email" type="email" placeholder="nom@pasola.fr"/></div>'+
     '<div class="fld"><label>'+t('tm_role')+'</label><select id="nu-role"><option value="editor">'+t('tm_editor')+'</option><option value="viewer">'+t('tm_viewer')+'</option><option value="owner">'+t('tm_owner')+'</option></select></div>'+
     '<div class="fld"><label>'+t('pass')+'</label><input id="nu-pass" type="text" placeholder="min. 8 caractères"/></div>'+
     '<div class="full"><button class="btn-primary" id="nuBtn" style="width:auto;padding:11px 22px">'+t('tm_create')+'</button></div>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-h"><span class="t">'+t('tm_title')+'</span><span class="sub">'+(D.team||[]).length+'</span></div><div class="tw"><table class="tbl"><thead><tr><th>'+t('tm_name')+'</th><th>'+t('tm_role')+'</th><th>Date</th><th>Dernier login</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

/* ---------- wire events ---------- */
function wire(){
  document.querySelectorAll('[data-row]').forEach(function(tr){tr.onclick=function(){var i=+tr.dataset.row;openRow=(openRow===i?null:i);render();};});
  document.querySelectorAll('[data-seg]').forEach(function(b){b.onclick=function(){segment=b.dataset.seg;openRow=null;render();};});
  var exp=document.getElementById('expCsv');if(exp)exp.onclick=exportCsv;
  document.querySelectorAll('[data-goteam]').forEach(function(b){b.onclick=function(){VIEW='team';openRow=null;buildNav();render();};});
  var q=document.getElementById('q');if(q)q.oninput=function(){var v=q.value.toLowerCase();document.querySelectorAll('#panes tbody tr[data-row]').forEach(function(tr){tr.style.display=tr.textContent.toLowerCase().indexOf(v)>=0?'':'none';});};
  document.querySelectorAll('[data-paid]').forEach(function(b){b.onclick=function(){fetch(API+'/api/affiliate/mark-paid',{method:'POST',headers:{'Authorization':AUTH,'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.paid,paid:+b.dataset.to})}).then(function(){loadAll();});};});
  document.querySelectorAll('[data-uid]').forEach(function(b){b.onclick=function(){fetch(API+'/api/admin-user-toggle',{method:'POST',headers:{'Authorization':AUTH,'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.uid,active:+b.dataset.to})}).then(function(){loadAll();});};});
  var nub=document.getElementById('nuBtn');if(nub)nub.onclick=function(){
    var body={name:document.getElementById('nu-name').value,email:document.getElementById('nu-email').value,role:document.getElementById('nu-role').value,password:document.getElementById('nu-pass').value};
    var msg=document.getElementById('tmMsg');msg.className='feedback';
    fetch(API+'/api/admin-user-create',{method:'POST',headers:{'Authorization':AUTH,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});}).then(function(x){
      if(x.ok){msg.textContent=t('tm_created');msg.className='feedback ok';loadAll();}
      else{msg.textContent=x.j.error||'Erreur';msg.className='feedback no';}
    });
  };
}
function exportCsv(){
  var rows=[['Type','Nom','Email','Entité','Source','Pays','Engagement','Statut','Dernière activité']];
  contactRows().forEach(function(r){rows.push([r.kind,r.name.replace(/<[^>]+>/g,''),r.email||r.id||'',(r.srcRaw||''),r.country,r.hot,r.status,fmtDay(r.last)]);});
  var csv=rows.map(function(row){return row.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pasola-crm-contacts.csv';a.click();
}

/* ---------- start ---------- */
if(AUTH&&ME){boot();}
</script>
